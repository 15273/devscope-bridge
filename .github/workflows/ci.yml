name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e . pytest pytest-asyncio

      - name: Run tests
        # test_scan_agents_finds_project_agents expects a .claude/agents/
        # directory (with an `ht-backend-engineer` agent) that is not part of
        # this repository, so it can only pass on the author's machine.
        # Tests marked `empirical` are already skipped by conftest.py unless
        # RUN_EMPIRICAL=1.
        run: >
          pytest
          --deselect devscope_bridge/tests/test_agents_scanner.py::test_scan_agents_finds_project_agents

  extension-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      # `npm run lint` (tsc --noEmit) is intentionally not run: it currently
      # reports pre-existing type errors in the source tree (including test
      # files importing `vitest`, which is not a declared dependency).
      - run: npm run build
