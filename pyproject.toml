[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devscope-bridge"
version = "0.1.0"
description = "Local loopback bridge between the DevScope Chrome extension and the Claude / Cursor CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["devscope", "chrome-extension", "claude", "bridge"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    # mcp 2.x removed `mcp.server.fastmcp`, which the MCP stdio servers import
    "mcp>=1.0,<2",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
devscope-bridge = "devscope_bridge.main:run"

[project.urls]
Homepage = "https://github.com/15273/devscope-bridge"

[tool.setuptools.packages.find]
where = ["."]
include = ["devscope_bridge*"]
exclude = ["devscope_bridge.tests*"]

[tool.setuptools.package-data]
"devscope_bridge" = ["whatsapp/*.js", "whatsapp/*.json"]

[tool.pytest.ini_options]
testpaths = ["devscope_bridge/tests"]
pythonpath = ["."]
addopts = "-q"
